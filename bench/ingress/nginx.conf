worker_processes 1;
daemon off;
master_process off;
pid /tmp/nginx-bench.pid;

events {
  worker_connections 4096;
}

http {
  access_log off;
  error_log /dev/stderr error;
  server_tokens off;
  keepalive_timeout 30;

  server {
    listen 18080;
    server_name worker.example.test;
    default_type "text/plain; charset=utf-8";

    location = /actor {
      return 200 "hello from native Oreslang actor service";
    }

    location = /api {
      if ($http_x_demo_token = "") {
        return 403 "Request denied";
      }
      return 501 "Upstream forwarding unavailable in this runtime";
    }

    location / {
      return 404 "No route";
    }
  }
}
