global
  maxconn 4096
  nbthread 1

defaults
  mode http
  timeout connect 2s
  timeout client 30s
  timeout server 30s

frontend ingress_bench
  bind 127.0.0.1:18081
  acl host_worker hdr(host) -i worker.example.test
  acl actor_path path -i /actor
  acl api_path path -i /api
  acl has_demo_token req.hdr(x-demo-token) -m found

  http-request return status 200 content-type "text/plain; charset=utf-8" string "hello from native Oreslang actor service" if host_worker actor_path
  http-request return status 403 content-type "text/plain; charset=utf-8" string "Request denied" if host_worker api_path !has_demo_token
  http-request return status 501 content-type "text/plain; charset=utf-8" string "Upstream forwarding unavailable in this runtime" if host_worker api_path has_demo_token
  http-request return status 404 content-type "text/plain; charset=utf-8" string "No route"
