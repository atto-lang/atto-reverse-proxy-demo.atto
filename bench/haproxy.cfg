global
    nbthread 1
    maxconn 1024
defaults
    mode http
    timeout connect 2s
    timeout client 5s
    timeout server 5s
    retries 0
    option httpclose
frontend fixture
    bind 127.0.0.1:9082
    http-request return status 501 content-type text/plain string "Upstream forwarding unavailable in this runtime" if { path -m str /ingress }
    default_backend origin
backend origin
    server fixture 127.0.0.1:9090 maxconn 1024
