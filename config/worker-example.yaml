version: ores.proxy/v1
mode: reverse
listen:
  host: 127.0.0.1
  port: 8080
runtime:
  carriers: 20
  actors: 100
  max_inflight: 1024
services:
  - name: greeting
    kind: actor
    target: hello-v1
middleware:
  - name: trace
    kind: trace
  - name: required
    kind: require_header
    header: x-demo-token
routes:
  - name: workers
    host: worker.example.test
    path_prefix: /actor
    upstream: service://greeting
    middleware: trace
  - name: origin
    host: worker.example.test
    path_prefix: /api
    upstream: http://127.0.0.1:9000
    middleware: required
