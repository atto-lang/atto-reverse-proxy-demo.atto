version: ores.proxy/v1
mode: reverse
listen:
  host: 127.0.0.1
  port: 8080
runtime:
  carriers: 20
  actors: 100
  max_inflight: 1024
services:
  - name: greeting
    kind: actor
    target: hello-v1
  - name: streaming
    kind: actor
    target: stream-v1
  - name: unavailable
    kind: actor
    target: not-registered
middleware:
  - name: required
    kind: require_header
    header: x-demo-token
routes:
  - name: workers
    host: worker.example.test
    path_prefix: /actor
    upstream: service://greeting
  - name: streaming-route
    host: worker.example.test
    path_prefix: /stream
    upstream: service://streaming
  - name: unregistered-route
    host: worker.example.test
    path_prefix: /unregistered
    upstream: service://unavailable
  - name: origin
    host: worker.example.test
    path_prefix: /api
    upstream: http://127.0.0.1:9000
    middleware: required
