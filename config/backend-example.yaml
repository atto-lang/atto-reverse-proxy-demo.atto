version: ores.proxy/v1
mode: reverse
listen:
  host: 127.0.0.1
  port: 8080
runtime:
  carriers: 20
  actors: 100
  max_inflight: 1024
backends:
  - name: api-blue
    pool: api
    origin: https://blue.example.test:443
    weight: 3
  - name: api-green
    pool: api
    origin: https://green.example.test:443
    weight: 1
routes:
  - name: api-route
    host: api.example.test
    path_prefix: /
    upstream: pool://api
