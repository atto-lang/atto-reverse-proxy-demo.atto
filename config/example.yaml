version: ores.proxy/v1
mode: reverse
listen:
  host: 127.0.0.1
  port: 8080
runtime:
  carriers: 20
  actors: 100
  max_inflight: 1024
middleware:
  - name: trace
    kind: trace
  - name: protected
    kind: require_header
    header: x-internal-token
routes:
  - name: api
    host: api.example.test
    path_prefix: /api
    upstream: http://127.0.0.1:9000
    middleware: trace,protected
