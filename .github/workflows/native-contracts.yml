# Native compiler and contract gate. No runtime source checkout or cross-org mirror.
# A trusted source-org runner carrying the 'oreslang-jdk25' label must have an
# approved Oreslang Java/Graal executable on PATH. Missing runtime is a failure.
name: Native Oreslang Proxy Contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    # Never execute untrusted fork code on the organization's self-hosted runner.
    # Only the approved repository and trusted same-repo PR heads may reserve this runner.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.repository.id == 1429954649 &&
       github.event.pull_request.head.repo.id == 1429954649 &&
       github.event.pull_request.base.repo.id == 1429954649 &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.repository.id == 1429954649 &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' &&
       github.event.repository.id == 1429954649 &&
       github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 25
    steps:
      - name: Checkout exact event tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify trusted exact-head native runtime before compiling
        shell: bash
        env:
          APPROVED_REPOSITORY_ID: '1429954649'
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          EVENT_PR_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SOURCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          APPROVED_ORESLANG_SHA256: ${{ vars.ORESLANG_APPROVED_SHA256 }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unexpected repository ID' >&2; exit 1; }
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            test "$EVENT_PR_HEAD_REPO_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'untrusted head repository ID' >&2; exit 1; }
            test "$EVENT_PR_BASE_REPO_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'untrusted base repository ID' >&2; exit 1; }
          fi
          test "${RUNNER_OS:-}" = Linux && test "${RUNNER_ARCH:-}" = X64 && test "$(uname -m)" = x86_64
          test -n "${RUNNER_NAME:-}" || { echo 'no assigned runner name' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD" || { echo 'source head mismatch' >&2; exit 1; }
          printf 'runner_name=%s\nrepository_id=%s\nsource_head=%s\nsource_tree=%s\n' "$RUNNER_NAME" "$EVENT_REPOSITORY_ID" "$EXPECTED_SOURCE_HEAD" "$(git rev-parse HEAD^{tree})"
          java -version
          jdk_spec="$(java -XshowSettings:properties -version 2>&1 | sed -nE 's/^[[:space:]]*java\.specification\.version[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' | head -n 1)"
          test "$jdk_spec" = 25 || { echo 'JDK25 required' >&2; exit 1; }
          launcher="$(type -P oreslang || true)"
          test -n "$launcher" || { echo 'missing Oreslang launcher' >&2; exit 1; }
          launcher="$(readlink -f -- "$launcher")"
          test -f "$launcher" && test -x "$launcher"
          if [[ ! "${APPROVED_ORESLANG_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'missing administrator-provided ORESLANG_APPROVED_SHA256' >&2
            exit 1
          fi
          actual_sha="$(sha256sum -- "$launcher" | cut -d ' ' -f 1)"
          printf 'oreslang_path=%s\noreslang_sha256=%s\n' "$launcher" "$actual_sha"
          test "$actual_sha" = "${APPROVED_ORESLANG_SHA256,,}" || { echo 'unapproved Oreslang launcher digest' >&2; exit 1; }
          echo 'oreslang_approved_digest=true'
          if timeout 15s "$launcher" --build-info; then
            echo 'oreslang_probe=--build-info'
          elif timeout 15s "$launcher" --version; then
            echo 'oreslang_probe=--version'
          elif timeout 15s "$launcher" --help; then
            echo 'oreslang_probe=--help'
          else
            echo 'bounded launcher probes failed' >&2
            exit 1
          fi
      - name: Confirm native compiler availability
        run: command -v oreslang
      - name: Record executable provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "repo_head=$(git rev-parse HEAD)"
          echo "repo_tree=$(git rev-parse HEAD^{tree})"
          command -v oreslang
          oreslang --build-info
          java -version
      - name: Verify reviewed Oreslang inventory is complete
        shell: bash
        run: |
          set -euo pipefail
          actual="$RUNNER_TEMP/oreslang-files.txt"
          find src tests -type f -name '*.ores' -print | LC_ALL=C sort > "$actual"
          if grep -Ev '^(src|tests)/[A-Za-z0-9_./-]+\.ores$' "$actual"; then
            echo "Oreslang source path outside the reviewable path contract" >&2
            exit 1
          fi
          diff -u ci/oreslang-files.txt "$actual"

          contracts="$RUNNER_TEMP/pure-contracts.txt"
          find tests -maxdepth 1 -type f -name '*_contract.ores' -print | LC_ALL=C sort > "$contracts"
          diff -u ci/pure-contracts.txt "$contracts"

          test -z "$(find src tests -type l -name '*.ores' -print -quit)"
      - name: Compiler-check every reviewed Oreslang source and test
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            echo "CHECK $file"
            oreslang --check "$file"
          done < ci/oreslang-files.txt
      - name: Execute every reviewed pure contract test
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            echo "RUN $file"
            oreslang "$file"
            count=$((count + 1))
          done < ci/pure-contracts.txt
          if (( count == 0 )); then
            echo "No pure contract tests declared" >&2
            exit 1
          fi
      - name: Execute loopback ingress and native TCP smoke together
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/reverse-ingress.log"
          config="$GITHUB_WORKSPACE/config/example.yaml"
          server_pid=""

          cleanup() {
            if [[ -n "$server_pid" ]] && kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" 2>/dev/null || true
              for _ in {1..50}; do
                kill -0 "$server_pid" 2>/dev/null || break
                sleep 0.1
              done
              kill -KILL "$server_pid" 2>/dev/null || true
            fi
            if [[ -n "$server_pid" ]]; then
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          env ores_proxy_conf_yaml="$config" \
            oreslang \
              --allow-env=ores_proxy_conf_yaml \
              --allow-read="$config" \
              --allow-net=127.0.0.1:8080 \
              src/serve_reverse.ores >"$log" 2>&1 &
          server_pid=$!

          ready=0
          for _ in {1..100}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log" >&2
              echo "reverse ingress exited before readiness" >&2
              exit 1
            fi
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              exec 3>&-
              ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat "$log" >&2
            echo "reverse ingress did not become ready" >&2
            exit 1
          fi

          timeout --signal=TERM --kill-after=5s 30s \
            oreslang --allow-net=127.0.0.1:8080 tests/ingress_tcp_smoke.ores

          kill -0 "$server_pid"
          grep -Fq 'INCOMPLETE reverse proxy ingress; loopback only; 501 upstream response' "$log"
