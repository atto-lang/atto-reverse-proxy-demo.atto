# Native compiler and contract gate. No runtime source checkout or cross-org mirror.
# A trusted, isolated runner carrying the 'oreslang-jdk25' label must have an
# approved Oreslang Java/Graal executable on PATH. Missing runtime is a failure.
name: Native Oreslang Proxy Contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    # Never execute untrusted fork code on the organization's self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 20
    steps:
      - name: Checkout exact event tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Confirm native compiler availability
        run: command -v oreslang
      - name: Compiler-check every Oreslang source and test
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "CHECK $file"
            oreslang --check "$file"
          done < <(find src tests -type f -name '*.ores' -print0 | sort -z)
      - name: Execute every pure contract test
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "RUN $file"
            oreslang "$file"
            count=$((count + 1))
          done < <(find tests -type f -name '*_contract.ores' -print0 | sort -z)
          if (( count == 0 )); then
            echo "No *_contract.ores tests found" >&2
            exit 1
          fi
