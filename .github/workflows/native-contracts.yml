# Native compiler and contract gate. No runtime source checkout or cross-org mirror.
# A trusted, isolated runner carrying the 'oreslang-jdk25' label must have an
# approved Oreslang Java/Graal executable on PATH. Missing runtime is a failure.
name: Native Oreslang Proxy Contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contracts:
    # Never execute untrusted fork code on the organization's self-hosted runner.
    # Reserve the trusted runner only for the immutable approved repository.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.repository.id == 1429954649 &&
       github.event.pull_request.head.repo.id == 1429954649 &&
       github.event.pull_request.base.repo.id == 1429954649 &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.repository.id == 1429954649 &&
       github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Fail closed on exact source and approved native runner provenance
        shell: bash
        env:
          APPROVED_REPOSITORY_ID: '1429954649'
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          EVENT_PR_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          APPROVED_ORESLANG_SHA256: ${{ vars.ORESLANG_APPROVED_SHA256 }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved event repository ID' >&2; exit 1; }
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$EVENT_PR_HEAD_REPO_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved PR head repository ID' >&2; exit 1; }
            test "$EVENT_PR_BASE_REPO_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved PR base repository ID' >&2; exit 1; }
          fi
          test "${RUNNER_OS:-}" = Linux && test "${RUNNER_ARCH:-}" = X64 && test "$(uname -m)" = x86_64
          test -n "${RUNNER_NAME:-}" || { echo 'missing assigned runner name' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo 'exact-head checkout mismatch' >&2; exit 1; }
          printf 'runner_name=%s\nrepository_id=%s\nsource_head=%s\nsource_tree=%s\n' "$RUNNER_NAME" "$EVENT_REPOSITORY_ID" "$EXPECTED_SHA" "$(git rev-parse HEAD^{tree})"
          java -version
          jdk_spec="$(java -XshowSettings:properties -version 2>&1 | sed -nE 's/^[[:space:]]*java\.specification\.version[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' | head -n 1)"
          test "$jdk_spec" = 25 || { echo 'JDK 25 required' >&2; exit 1; }
          launcher="$(type -P oreslang || true)"
          test -n "$launcher" || { echo 'Oreslang launcher missing' >&2; exit 1; }
          launcher="$(readlink -f -- "$launcher")"
          test -f "$launcher" && test -x "$launcher" || { echo 'invalid Oreslang launcher path' >&2; exit 1; }
          if [[ ! "${APPROVED_ORESLANG_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'missing administrator-approved Oreslang launcher SHA-256' >&2
            exit 1
          fi
          actual_sha="$(sha256sum -- "$launcher" | cut -d ' ' -f 1)"
          printf 'oreslang_path=%s\noreslang_sha256=%s\n' "$launcher" "$actual_sha"
          test "$actual_sha" = "${APPROVED_ORESLANG_SHA256,,}" || { echo 'unapproved Oreslang launcher' >&2; exit 1; }
          echo 'oreslang_approved_digest=true'
          if timeout 15s "$launcher" --build-info; then
            echo 'oreslang_probe=--build-info'
          elif timeout 15s "$launcher" --version; then
            echo 'oreslang_probe=--version'
          elif timeout 15s "$launcher" --help; then
            echo 'oreslang_probe=--help'
          else
            echo 'bounded Oreslang launcher probes failed' >&2
            exit 1
          fi
      - name: Compiler-check entrypoint
        run: oreslang --check src/main.ores
      - name: Compiler-check configuration path admission
        run: oreslang --check src/config_path.ores
      - name: Compiler-check YAML parser
        run: oreslang --check src/proxy_yaml.ores
      - name: Compiler-check routing policy
        run: oreslang --check src/route_policy.ores
      - name: Compiler-check middleware policy
        run: oreslang --check src/middleware_policy.ores
      - name: Compiler-check generation coordinator
        run: oreslang --check src/generation.ores
      - name: Compiler-check native YAML contract
        run: oreslang --check tests/yaml_policy_contract.ores
      - name: Compiler-check native generation contract
        run: oreslang --check tests/generation_contract.ores
      - name: Compiler-check native middleware contract
        run: oreslang --check tests/middleware_generation_contract.ores
      - name: Compiler-check canonical path contract
        run: oreslang --check tests/path_admission_contract.ores
      - name: Execute canonical configuration path contract
        run: oreslang tests/path_admission_contract.ores
      - name: Execute YAML / routing / policy contract
        run: oreslang tests/yaml_policy_contract.ores
      - name: Execute generation epoch / rollback contract
        run: oreslang tests/generation_contract.ores
      - name: Execute independent middleware snapshot contract
        run: oreslang tests/middleware_generation_contract.ores

      - name: Compiler-check HTTP metadata admission and header filtering
        run: |
          oreslang --check src/proxy_wire.ores
          oreslang --check src/header_policy.ores
      - name: Compiler-check native slot lifecycle, middleware manifest and data layouts
        run: |
          oreslang --check src/slot_lifecycle.ores
          oreslang --check src/slot_pool.ores
          oreslang --check src/middleware_manifest.ores
          oreslang --check src/data_layout.ores
      - name: Compiler-check all security and slot regression vectors
        run: |
          oreslang --check tests/security_admission_contract.ores
          oreslang --check tests/wire_contract.ores
          oreslang --check tests/header_policy_contract.ores
          oreslang --check tests/middleware_manifest_contract.ores
          oreslang --check tests/data_layout_contract.ores
          oreslang --check tests/slot_lifecycle_contract.ores
          oreslang --check tests/slot_pool_contract.ores
      - name: Compiler-check opt-in reverse ingress and TCP smoke
        run: |
          oreslang --check src/serve_reverse.ores
          oreslang --check tests/ingress_tcp_smoke.ores
      - name: Execute complete Oreslang safety contracts
        run: |
          oreslang tests/security_admission_contract.ores
          oreslang tests/wire_contract.ores
          oreslang tests/header_policy_contract.ores
          oreslang tests/middleware_manifest_contract.ores
          oreslang tests/data_layout_contract.ores
          oreslang tests/slot_lifecycle_contract.ores
          oreslang tests/slot_pool_contract.ores

      - name: Compiler-check actor service, LB, rate and circuit modules
        run: |
          oreslang --check src/service_bindings.ores
          oreslang --check src/load_balancer.ores
          oreslang --check src/traffic_controls.ores
          oreslang --check src/network_admission.ores
          oreslang --check tests/service_bindings_contract.ores
          oreslang --check tests/load_balancer_contract.ores
          oreslang --check tests/traffic_controls_contract.ores
          oreslang --check tests/network_admission_contract.ores
      - name: Execute actor service, LB, rate and circuit contracts
        run: |
          oreslang tests/service_bindings_contract.ores
          oreslang tests/load_balancer_contract.ores
          oreslang tests/traffic_controls_contract.ores
          oreslang tests/network_admission_contract.ores
      - name: Compiler-check opt-in local actor-service real TCP client
        run: oreslang --check tests/actor_ingress_tcp_smoke.ores
