# Native compiler and contract gate. No runtime source checkout or cross-org mirror.
# A trusted, isolated runner carrying the 'oreslang-jdk25' label must have an
# approved Oreslang Java/Graal executable on PATH. Missing runtime is a failure.
name: Native Oreslang Proxy Contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contracts:
    # Never execute untrusted fork code on the organization's self-hosted runner.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR tree
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify exact PR HEAD and runtime provenance
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          command -v oreslang
          sha256sum "$(command -v oreslang)"
          java -version
      - name: Compiler-check entrypoint
        run: oreslang --check src/main.ores
      - name: Compiler-check configuration path admission
        run: oreslang --check src/config_path.ores
      - name: Compiler-check YAML parser
        run: oreslang --check src/proxy_yaml.ores
      - name: Compiler-check routing policy
        run: oreslang --check src/route_policy.ores
      - name: Compiler-check middleware policy
        run: oreslang --check src/middleware_policy.ores
      - name: Compiler-check generation coordinator
        run: oreslang --check src/generation.ores
      - name: Compiler-check native YAML contract
        run: oreslang --check tests/yaml_policy_contract.ores
      - name: Compiler-check native generation contract
        run: oreslang --check tests/generation_contract.ores
      - name: Compiler-check native middleware contract
        run: oreslang --check tests/middleware_generation_contract.ores
      - name: Compiler-check canonical path contract
        run: oreslang --check tests/path_admission_contract.ores
      - name: Execute canonical configuration path contract
        run: oreslang tests/path_admission_contract.ores
      - name: Execute YAML / routing / policy contract
        run: oreslang tests/yaml_policy_contract.ores
      - name: Execute generation epoch / rollback contract
        run: oreslang tests/generation_contract.ores
      - name: Execute independent middleware snapshot contract
        run: oreslang tests/middleware_generation_contract.ores

      - name: Compiler-check HTTP metadata admission and header filtering
        run: |
          oreslang --check src/proxy_wire.ores
          oreslang --check src/header_policy.ores
      - name: Compiler-check native slot lifecycle, middleware manifest and data layouts
        run: |
          oreslang --check src/slot_lifecycle.ores
          oreslang --check src/slot_pool.ores
          oreslang --check src/middleware_manifest.ores
          oreslang --check src/data_layout.ores
      - name: Compiler-check all security and slot regression vectors
        run: |
          oreslang --check tests/security_admission_contract.ores
          oreslang --check tests/wire_contract.ores
          oreslang --check tests/header_policy_contract.ores
          oreslang --check tests/middleware_manifest_contract.ores
          oreslang --check tests/data_layout_contract.ores
          oreslang --check tests/slot_lifecycle_contract.ores
          oreslang --check tests/slot_pool_contract.ores
      - name: Compiler-check opt-in reverse ingress and TCP smoke
        run: |
          oreslang --check src/serve_reverse.ores
          oreslang --check tests/ingress_tcp_smoke.ores
      - name: Fail closed if reverse ingress configuration vanishes
        shell: bash
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/ores-proxy-missing-config.yaml"
          rm -f "$missing"
          set +e
          ores_proxy_conf_yaml="$missing" oreslang --no-prompt \
            --allow-read="$missing" \
            --allow-env=ores_proxy_conf_yaml \
            src/serve_reverse.ores >"$RUNNER_TEMP/missing-config.log" 2>&1
          status=$?
          set -e
          test "$status" = 74
          grep -Fq 'ERROR: configuration admission failed' "$RUNNER_TEMP/missing-config.log"
      - name: Execute complete Oreslang safety contracts
        run: |
          oreslang tests/security_admission_contract.ores
          oreslang tests/wire_contract.ores
          oreslang tests/header_policy_contract.ores
          oreslang tests/middleware_manifest_contract.ores
          oreslang tests/data_layout_contract.ores
          oreslang tests/slot_lifecycle_contract.ores
          oreslang tests/slot_pool_contract.ores

      - name: Compiler-check lexical admission regression
        run: |
          oreslang --check src/admission_text.ores
          oreslang --check tests/lexical_admission_contract.ores
      - name: Execute lexical admission regression
        run: oreslang tests/lexical_admission_contract.ores

      - name: Compiler-check and execute native policy performance workload
        run: |
          oreslang --check tests/perf_policy_contract.ores
          oreslang tests/perf_policy_contract.ores
