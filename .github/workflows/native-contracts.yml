# Native compiler and contract gate. No runtime source checkout or cross-org mirror.
# A trusted, isolated runner carrying the 'oreslang-jdk25' label must have an
# approved Oreslang Java/Graal executable on PATH. Missing runtime is a failure.
name: Native Oreslang Proxy Contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contracts:
    # Never execute untrusted fork code on the organization's self-hosted runner.
    # Deny forks/cross-repo PRs before reserving a trusted self-hosted runner.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.repository.id == 1429954649 &&
       github.event.pull_request.head.repo.id == 1429954649 &&
       github.event.pull_request.base.repo.id == 1429954649 &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.repository.id == 1429954649 &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' &&
       github.event.repository.id == 1429954649 &&
       github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Fail closed on native runner, source and compiler provenance
        shell: bash
        env:
          APPROVED_REPOSITORY_ID: '1429954649'
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          EVENT_PR_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SOURCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          APPROVED_ORESLANG_SHA256: ${{ vars.ORESLANG_APPROVED_SHA256 }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved repository ID' >&2; exit 1; }
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$EVENT_PR_HEAD_REPO_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved PR head repository ID' >&2; exit 1; }
            test "$EVENT_PR_BASE_REPO_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved PR base repository ID' >&2; exit 1; }
          fi
          test "${RUNNER_OS:-}" = Linux && test "${RUNNER_ARCH:-}" = X64 && test "$(uname -m)" = x86_64
          test -n "${RUNNER_NAME:-}" || { echo 'missing assigned runner name' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD" || { echo 'source HEAD mismatch' >&2; exit 1; }
          printf 'runner_name=%s\nrepository_id=%s\nsource_head=%s\nsource_tree=%s\n' "$RUNNER_NAME" "$EVENT_REPOSITORY_ID" "$EXPECTED_SOURCE_HEAD" "$(git rev-parse HEAD^{tree})"
          java -version
          jdk_spec="$(java -XshowSettings:properties -version 2>&1 | sed -nE 's/^[[:space:]]*java\.specification\.version[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' | head -n 1)"
          test "$jdk_spec" = 25 || { echo 'JDK 25 required' >&2; exit 1; }
          launcher="$(type -P oreslang || true)"
          test -n "$launcher" || { echo 'Oreslang launcher not installed' >&2; exit 1; }
          launcher="$(readlink -f -- "$launcher")"
          test -f "$launcher" && test -x "$launcher"
          if [[ ! "${APPROVED_ORESLANG_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'invalid administrator-provided ORESLANG_APPROVED_SHA256' >&2
            exit 1
          fi
          actual_sha="$(sha256sum -- "$launcher" | cut -d ' ' -f 1)"
          printf 'oreslang_path=%s\noreslang_sha256=%s\n' "$launcher" "$actual_sha"
          test "$actual_sha" = "${APPROVED_ORESLANG_SHA256,,}" || { echo 'unapproved launcher SHA-256' >&2; exit 1; }
          echo 'oreslang_approved_digest=true'
          if timeout 15s "$launcher" --build-info; then
            echo 'oreslang_probe=--build-info'
          elif timeout 15s "$launcher" --version; then
            echo 'oreslang_probe=--version'
          elif timeout 15s "$launcher" --help; then
            echo 'oreslang_probe=--help'
          else
            echo 'bounded Oreslang invocation failed' >&2
            exit 1
          fi
      - name: Confirm native compiler availability
        run: command -v oreslang
      - name: Compiler-check entrypoint
        run: oreslang --check src/main.ores
      - name: Compiler-check configuration path admission
        run: oreslang --check src/config_path.ores
      - name: Compiler-check YAML parser
        run: oreslang --check src/proxy_yaml.ores
      - name: Compiler-check typed HTTP header policy
        run: oreslang --check src/header_policy.ores
      - name: Compiler-check legacy header contract
        run: oreslang --check tests/header_policy_contract.ores
      - name: Compiler-check header enum contract
        run: oreslang --check tests/header_enum_contract.ores
      - name: Compiler-check routing policy
        run: oreslang --check src/route_policy.ores
      - name: Compiler-check middleware policy
        run: oreslang --check src/middleware_policy.ores
      - name: Compiler-check generation coordinator
        run: oreslang --check src/generation.ores
      - name: Compiler-check native YAML contract
        run: oreslang --check tests/yaml_policy_contract.ores
      - name: Compiler-check native generation contract
        run: oreslang --check tests/generation_contract.ores
      - name: Compiler-check native middleware contract
        run: oreslang --check tests/middleware_generation_contract.ores
      - name: Compiler-check safe middleware header declarations
        run: oreslang --check tests/header_middleware_config_contract.ores
      - name: Compiler-check middleware manifest contract
        run: oreslang --check tests/middleware_manifest_contract.ores
      - name: Compiler-check canonical path contract
        run: oreslang --check tests/path_admission_contract.ores
      - name: Execute canonical configuration path contract
        run: oreslang tests/path_admission_contract.ores
      - name: Execute YAML / routing / policy contract
        run: oreslang tests/yaml_policy_contract.ores
      - name: Execute generation epoch / rollback contract
        run: oreslang tests/generation_contract.ores
      - name: Execute middleware header admission contract
        run: oreslang tests/header_middleware_config_contract.ores
      - name: Execute generation-pinned middleware manifest contract
        run: oreslang tests/middleware_manifest_contract.ores
      - name: Execute independent middleware snapshot contract
        run: oreslang tests/middleware_generation_contract.ores
      - name: Execute legacy HTTP header policy contract
        run: oreslang tests/header_policy_contract.ores
      - name: Execute typed HTTP header enum contract
        run: oreslang tests/header_enum_contract.ores
