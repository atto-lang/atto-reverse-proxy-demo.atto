# RETIRED: the historical workflow was callable by same-repo PR heads and
# scheduled self-hosted 'oreslang-jdk25' runners. Repo-local PR authors can
# control those source bytes; fork exclusion alone did not create a trust
# boundary. Native tests must move to independently reviewed protected-main
# trusted workflows with complete root-owned runtime manifest attestation.
# This intentionally fails if manually invoked and NEVER runs guest code.
name: Legacy native proxy workflow disabled (NOT_EXECUTED)
on:
  workflow_dispatch:
permissions: {}
jobs:
  fail-closed-legacy-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse unapproved native self-hosted execution
        shell: bash
        run: |
          echo "::error::LEGACY_NATIVE_DISABLED: this source-branch workflow cannot certify Oreslang."
          echo "::error::Use the independently reviewed protected-main native control plane."
          echo "NATIVE_ORESLANG_PROXY_TESTS=NOT_EXECUTED"
          exit 78
