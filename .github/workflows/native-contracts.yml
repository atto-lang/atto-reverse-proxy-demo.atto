# Legacy PR-head native workflow retired before trusted runners are provisioned.
# This used to execute same-repository PR-controlled code on a self-hosted
# runner. It must never be treated as successful native release evidence.
# The independently reviewed frozen-source admission workflow is proposed in
# .github/workflows/trusted-frozen-reverse-native.yml (PR #20).
# Admin: protect default main, require independent review, and restrict native
# runner groups to specifically approved workflows before enabling runners.
name: Legacy Native Oreslang Proxy Contracts (retired, fail closed)
on:
  workflow_dispatch:
permissions: {}
jobs:
  legacy-disabled:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id == '1429954649' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse legacy native admission
        shell: bash
        run: |
          echo 'ERROR: legacy PR-head native workflow retired; not an Oreslang test result' >&2
          echo 'Use protected-main trusted-frozen-reverse-native workflow after independent review' >&2
          exit 1
