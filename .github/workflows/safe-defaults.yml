# Host-only strict byte-for-byte config fixture; does not execute Python or Oreslang.
name: Reverse proxy safe defaults
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR-head checkout
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEMO_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEMO_SHA"
      - name: Validate exact canonical flags and reverse example without Python
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf -- "$fixture_dir"' EXIT
          cat > "$fixture_dir/flags" <<'EXPECTED_FLAGS'
          # Native Oreslang proxy flags-2-env contract.
          [flags.config-yaml]
          env = "ores_proxy_conf_yaml"
          aliases = ["config-yaml", "conf"]
          type = "string"
          help = "Absolute trusted path to a proxy YAML configuration file."
          EXPECTED_FLAGS
          cat > "$fixture_dir/config" <<'EXPECTED_CONFIG'
          version: ores.proxy/v1
          mode: reverse
          listen:
            host: 127.0.0.1
            port: 8080
          runtime:
            carriers: 20
            actors: 100
            max_inflight: 1024
          middleware:
            - name: trace
              kind: trace
            - name: protected
              kind: require_header
              header: x-internal-token
          routes:
            - name: api
              host: api.example.test
              path_prefix: /api
              upstream: http://127.0.0.1:9000
              middleware: trace,protected
          EXPECTED_CONFIG
          for pair in ".cli-flags.toml:flags" "config/example.yaml:config"; do
            actual="${pair%%:*}"
            fixture="${pair#*:}"
            [[ -f "$actual" && ! -L "$actual" ]] &&
              git ls-files --error-unmatch -- "$actual" >/dev/null 2>&1 &&
              cmp -s -- "$actual" "$fixture_dir/$fixture" || {
                echo "SAFE_DEFAULTS_FAILURE: noncanonical $actual" >&2
                exit 1
              }
          done
          echo 'SAFE_DEFAULTS_STRUCTURAL_PASS; ORESLANG_COMPILER_AND_WIRE_NOT_EXECUTED'
