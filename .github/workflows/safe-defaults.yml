name: Reverse proxy safe defaults
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate flags-2-env admission contract in Rust
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet
          git diff --cached --quiet
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          rustc --edition=2021 -D warnings --test ci/flags_contract.rs -o "$tmp/flags_tests"
          "$tmp/flags_tests"
          rustc --edition=2021 -D warnings ci/flags_contract.rs -o "$tmp/flags_contract"
          "$tmp/flags_contract" .cli-flags.toml
      - name: Validate reverse-proxy example stays loopback and protected
        shell: bash
        run: |
          set -euo pipefail
          test -f config/example.yaml
          test ! -L config/example.yaml
          grep -Fxq 'mode: reverse' config/example.yaml
          grep -Fxq '  host: 127.0.0.1' config/example.yaml
          grep -Fxq '    kind: require_header' config/example.yaml
          grep -Fxq '    header: x-internal-token' config/example.yaml
          grep -Fxq '    upstream: http://127.0.0.1:9000' config/example.yaml
          ! grep -Eq '(^|[[:space:]])host:[[:space:]]+(0\.0\.0\.0|::|\*)$' config/example.yaml
          echo 'SAFE_DEFAULTS_PASS: static config only; upstream forwarding proof NOT_EXECUTED.'
