name: Native actor ingress real-wire gate
on:
  pull_request:
    paths:
      - 'src/serve_reverse.ores'
      - 'src/proxy_yaml.ores'
      - 'src/route_policy.ores'
      - 'src/service_bindings.ores'
      - 'src/proxy_wire.ores'
      - 'config/worker-example.yaml'
      - 'tests/actor_ingress_tcp_smoke.ores'
      - '.github/workflows/actor-ingress-wire.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reverse-wire-${{ github.repository }}
  cancel-in-progress: false
jobs:
  actor-ingress:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Assert exact source and real compiler
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          command -v oreslang
          sha256sum "$(command -v oreslang)"
          java -version
          oreslang --check src/serve_reverse.ores
          oreslang --check tests/actor_ingress_tcp_smoke.ores
      - name: Fail closed if the configured file vanishes before read
        shell: bash
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/ores-proxy-missing-config.yaml"
          rm -f "$missing"
          set +e
          ores_proxy_conf_yaml="$missing" oreslang --no-prompt             --allow-read="$missing"             --allow-env=ores_proxy_conf_yaml             src/serve_reverse.ores >"$RUNNER_TEMP/missing-config.log" 2>&1
          status=$?
          set -e
          test "$status" = 74
          grep -Fq 'ERROR: configuration admission failed' "$RUNNER_TEMP/missing-config.log"

      - name: Real native Oreslang actor HTTP exchange over loopback
        shell: bash
        run: |
          set -euo pipefail
          export ores_proxy_conf_yaml="$GITHUB_WORKSPACE/config/worker-example.yaml"
          log="$RUNNER_TEMP/reverse-actor-ingress.log"
          # Only predeclared loopback is reachable. Do not grant --allow-all.
          oreslang --no-prompt --allow-net=127.0.0.1:8080 \
            --allow-read="$ores_proxy_conf_yaml" \
            --allow-env=ores_proxy_conf_yaml \
            src/serve_reverse.ores >"$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            if grep -Fq 'EXPERIMENTAL loopback actor ingress' "$log"; then
              ready=1
              break
            fi
            sleep 1
          done
          if test "$ready" != 1; then
            cat "$log"
            echo "Oreslang server did not bind within bounded readiness window" >&2
            exit 1
          fi
          oreslang --no-prompt --allow-net=127.0.0.1:8080 \
            tests/actor_ingress_tcp_smoke.ores
          cat "$log"
