# This integration test must never run unreviewed PR-head source on a
# self-hosted native runner. Manual execution is permitted only from an
# independently reviewed, protected main, after the approved runner group is
# restricted to this specific workflow. Source-only PR gates remain separate.
name: Native actor ingress real-wire gate (protected main only)
on:
  workflow_dispatch:
permissions: {}
# No inherited hook should affect the checkout action or the first native shell.
env:
  LD_PRELOAD: ''
  LD_LIBRARY_PATH: ''
  LD_AUDIT: ''
  BASH_ENV: ''
  ENV: ''
  NODE_OPTIONS: ''
  NODE_PATH: ''
  NODE_EXTRA_CA_CERTS: ''
  NODE_TLS_REJECT_UNAUTHORIZED: '1'
  JAVA_TOOL_OPTIONS: ''
  JDK_JAVA_OPTIONS: ''
  _JAVA_OPTIONS: ''
  CLASSPATH: ''
  GIT_CONFIG_COUNT: '0'
  GIT_CONFIG_PARAMETERS: ''
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_CONFIG_SYSTEM: /dev/null
concurrency:
  group: reverse-wire-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hosted-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id == '1429954649' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify protected main without checkout or guest code
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-reverse-proxy-demo.ores'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "${GITHUB_REF_PROTECTED:-}" = true
          test "$GITHUB_REPOSITORY_ID" = '1429954649'
          test -n "${GH_READ_TOKEN:-}"
          test -x /usr/bin/jq
          # Source-free hosted admission. No workflow checkout or private
          # repository source is touched before governance is established.
          get_github_json() {
            /usr/bin/curl -q --fail --silent --show-error --retry 0 \
              --proto '=https' --noproxy '*' --proxy '' \
              --cacert /etc/ssl/certs/ca-certificates.crt \
              --capath /etc/ssl/certs \
              --connect-timeout 5 --max-time 15 \
              -H "Authorization: Bearer $GH_READ_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$1"
          }
          repository_json="$(get_github_json \
            'https://api.github.com/repos/ores-truffle-oreslang/oreslang-reverse-proxy-demo.ores')"
          /usr/bin/jq -e '
            (.id == 1429954649) and
            (.full_name == "ores-truffle-oreslang/oreslang-reverse-proxy-demo.ores") and
            (.private == true) and (.visibility == "private") and
            (.default_branch == "main") and (.archived == false)
          ' <<<"$repository_json" >/dev/null || {
            echo 'actor wire admission: repo identity, private status or default branch differs' >&2
            exit 1
          }
          branch_json="$(get_github_json \
            'https://api.github.com/repos/ores-truffle-oreslang/oreslang-reverse-proxy-demo.ores/branches/main')"
          /usr/bin/jq -e --arg sha "$GITHUB_SHA" '
            (.protected == true) and (.commit.sha == $sha)
          ' <<<"$branch_json" >/dev/null || {
            echo 'actor wire admission: main is not protected at this control-plane SHA' >&2
            exit 1
          }
          # Active GitHub rules, not a PR-authored declaration, must require
          # independent approval and mandatory CI for the protected branch.
          rules_json="$(get_github_json \
            'https://api.github.com/repos/ores-truffle-oreslang/oreslang-reverse-proxy-demo.ores/rules/branches/main?per_page=100')"
          /usr/bin/jq -e '
            (type == "array") and
            any(.[]; .type == "pull_request" and
              (.parameters.required_approving_review_count >= 1) and
              (.parameters.dismiss_stale_reviews_on_push == true) and
              (.parameters.require_last_push_approval == true) and
              (.parameters.required_review_thread_resolution == true)) and
            any(.[]; .type == "required_status_checks" and
              ((.parameters.required_status_checks // []) | length > 0)) and
            any(.[]; .type == "non_fast_forward") and
            any(.[]; .type == "deletion")
          ' <<<"$rules_json" >/dev/null || {
            echo 'actor wire admission: effective protected-main review/status/force-push rules absent' >&2
            exit 1
          }
          # This API cannot establish an empty organization/repository bypass
          # list; an independent administrator must verify there is no bypass
          # and restrict the named runner group to this exact workflow.
          echo 'ACTOR_WIRE_HOSTED_PROTECTED_MAIN_PREFLIGHT_PASS; NO_GUEST_EXECUTED'
  actor-ingress:
    needs: hosted-preflight
    # No pull_request or pull_request_target path can allocate a native runner.
    # The runner group must ALSO be restricted by an independent administrator.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id == '1429954649' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    runs-on:
      group: oreslang-trusted-native
      labels: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact protected-main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: false
          set-safe-directory: false
          ref: ${{ github.sha }}
      - name: Verify trusted exact source and approved native runtime
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          APPROVED_REPOSITORY_ID: '1429954649'
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PROTECTED_REF: ${{ github.ref_protected }}
          APPROVED_ORESLANG_SHA256: ${{ vars.ORESLANG_APPROVED_SHA256 }}
          APPROVED_ORESLANG_RUNTIME_MANIFEST_SHA256: ${{ vars.ORESLANG_APPROVED_RUNTIME_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved repository ID' >&2; exit 1; }
          test "$EVENT_NAME" = workflow_dispatch || { echo 'native PR-head execution prohibited' >&2; exit 1; }
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'native non-main execution prohibited' >&2; exit 1; }
          test "$EXPECTED_PROTECTED_REF" = true || { echo 'native main not protected' >&2; exit 1; }
          test "${RUNNER_OS:-}" = Linux && test "${RUNNER_ARCH:-}" = X64 && test "$(uname -m)" = x86_64
          test -n "${RUNNER_NAME:-}" || { echo 'runner not assigned' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo 'exact source HEAD mismatch' >&2; exit 1; }
          printf 'runner_name=%s\nsource_head=%s\nsource_tree=%s\n' "$RUNNER_NAME" "$EXPECTED_SHA" "$(git rev-parse HEAD^{tree})"
          # The compiler and JDK are supplied by a separately approved
          # root-owned runtime; no mutable PATH lookup or setup-java download.
          test "$(/usr/bin/id -u)" != 0 || { echo 'runner must be unprivileged' >&2; exit 1; }
          runtime_root='/opt/oreslang-approved/oreslang-runtime'
          java_exe="$runtime_root/jdk/bin/java"
          launcher="$runtime_root/bin/oreslang"
          test -x "$java_exe" && test -f "$java_exe"
          test -x "$launcher" && test -f "$launcher"
          for path in /opt /opt/oreslang-approved "$runtime_root" "$runtime_root/bin" "$runtime_root/jdk" "$runtime_root/jdk/bin" "$launcher" "$java_exe"; do
            test ! -L "$path" || { echo 'runtime path is linked' >&2; exit 1; }
            test "$(/usr/bin/stat -c %u -- "$path")" = 0 || { echo 'runtime path is not root-owned' >&2; exit 1; }
            mode="$("/usr/bin/stat" -c %a -- "$path")"
            (( (8#$mode & 022) == 0 )) || { echo 'runtime path is writable by non-root' >&2; exit 1; }
          done
          # -xdev alone omits nested mounts and file bind mounts; check the
          # process mount table before trusting any manifest hashes.
          test -r /proc/self/mountinfo && test -x /usr/bin/awk
          mounted="$(
            /usr/bin/awk -v root="$runtime_root" -v prefix="$runtime_root/" \
              '$5==root || index($5,prefix)==1 {print $5; exit}' /proc/self/mountinfo
          )"
          test -z "$mounted" || { echo 'runtime path is or contains a bind mount' >&2; exit 1; }
          linked="$(/usr/bin/find "$runtime_root" -xdev -type l -print -quit)" || { echo 'runtime symlink scan failed' >&2; exit 1; }
          test -z "$linked" || { echo 'runtime symlink' >&2; exit 1; }
          special="$(/usr/bin/find "$runtime_root" -xdev ! -type d ! -type f -print -quit)" || { echo 'runtime special-file scan failed' >&2; exit 1; }
          test -z "$special" || { echo 'runtime special object' >&2; exit 1; }
          unsafe="$(/usr/bin/find "$runtime_root" -xdev \( ! -uid 0 -o -perm /022 -o -perm /6000 \) -print -quit)" || { echo 'runtime ownership scan failed' >&2; exit 1; }
          test -z "$unsafe" || { echo 'mutable or privileged runtime tree' >&2; exit 1; }
          test -x /usr/sbin/getcap
          cap_report="$(/usr/sbin/getcap -r "$runtime_root" 2>&1)" || { echo 'runtime capability scan failed' >&2; exit 1; }
          test -z "$cap_report" || { echo 'runtime carries file capabilities' >&2; exit 1; }
          [[ "${APPROVED_ORESLANG_RUNTIME_MANIFEST_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'approved manifest digest missing' >&2; exit 1; }
          actual_manifest="$(
            cd "$runtime_root"
            /usr/bin/find . -xdev -type f -print0 |
              LC_ALL=C /usr/bin/sort -z |
              /usr/bin/xargs -0 -r /usr/bin/sha256sum |
              /usr/bin/sha256sum | /usr/bin/cut -d ' ' -f 1
          )"
          test "$actual_manifest" = "${APPROVED_ORESLANG_RUNTIME_MANIFEST_SHA256,,}" || { echo 'unapproved runtime manifest' >&2; exit 1; }
          printf 'approved_runtime_manifest=%s\n' "$actual_manifest"
          "$java_exe" -version
          jdk_spec="$("$java_exe" -XshowSettings:properties -version 2>&1 | /usr/bin/sed -nE 's/^[[:space:]]*java\.specification\.version[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' | /usr/bin/head -n 1)"
          test "$jdk_spec" = 25 || { echo 'approved JDK 25 required' >&2; exit 1; }
          if [[ ! "${APPROVED_ORESLANG_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'missing administrator-approved Oreslang SHA-256' >&2
            exit 1
          fi
          actual_sha="$(sha256sum -- "$launcher" | cut -d ' ' -f 1)"
          printf 'oreslang_path=%s\noreslang_sha256=%s\n' "$launcher" "$actual_sha"
          test "$actual_sha" = "${APPROVED_ORESLANG_SHA256,,}" || { echo 'unapproved Oreslang launcher' >&2; exit 1; }
          echo 'oreslang_approved_digest=true'
          # A private wrapper rechecks the administrator-approved digest on each exec.
          test -n "${RUNNER_TEMP:-}" && test -n "${GITHUB_RUN_ID:-}" && test -n "${GITHUB_RUN_ATTEMPT:-}"
          wrapper_dir="${RUNNER_TEMP}/oreslang-wire-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 -- "$wrapper_dir"
          wrapper="$wrapper_dir/oreslang"
          printf '%s\n' '#!/bin/bash' 'set -euo pipefail' > "$wrapper"
          printf 'launcher=%q\n' "$launcher" >> "$wrapper"
          printf 'runtime_root=%q\n' "$runtime_root" >> "$wrapper"
          printf 'expected_sha=%q\n' "${APPROVED_ORESLANG_SHA256,,}" >> "$wrapper"
          printf 'expected_manifest=%q\n' "${APPROVED_ORESLANG_RUNTIME_MANIFEST_SHA256,,}" >> "$wrapper"
          printf '%s\n' \
            'test -f "$launcher" && test -x "$launcher" && test ! -L "$launcher" || exit 1' \
            'test "$(/usr/bin/stat -c %u -- "$launcher")" = 0 || exit 1' \
            'actual_sha="$(/usr/bin/sha256sum -- "$launcher" | /usr/bin/cut -d " " -f 1)"' \
            'test "$actual_sha" = "$expected_sha" || { echo "approved Oreslang launcher changed" >&2; exit 1; }' \
            'actual_manifest="$(cd "$runtime_root" && /usr/bin/find . -xdev -type f -print0 | LC_ALL=C /usr/bin/sort -z | /usr/bin/xargs -0 -r /usr/bin/sha256sum | /usr/bin/sha256sum | /usr/bin/cut -d " " -f 1)"' \
            'test "$actual_manifest" = "$expected_manifest" || { echo "approved runtime manifest changed" >&2; exit 1; }' \
            'exec "$launcher" "$@"' >> "$wrapper"
          chmod 700 "$wrapper"
          if timeout 15s "$wrapper" --build-info; then
            echo 'oreslang_probe=--build-info'
          elif timeout 15s "$wrapper" --version; then
            echo 'oreslang_probe=--version'
          elif timeout 15s "$wrapper" --help; then
            echo 'oreslang_probe=--help'
          else
            echo 'bounded Oreslang launcher probes failed' >&2
            exit 1
          fi
          "$wrapper" --check src/serve_reverse.ores
          "$wrapper" --check tests/actor_ingress_tcp_smoke.ores
      - name: Real native Oreslang actor HTTP exchange over loopback
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          APPROVED_ORESLANG_SHA256: ${{ vars.ORESLANG_APPROVED_SHA256 }}
          APPROVED_ORESLANG_RUNTIME_MANIFEST_SHA256: ${{ vars.ORESLANG_APPROVED_RUNTIME_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          # Revalidate the executable in the same step as real-wire execution.
          # An earlier step's PATH lookup cannot authorize later invocations.
          # The approved binary is never taken from PATH, even in a trusted job.
          runtime_root='/opt/oreslang-approved/oreslang-runtime'
          launcher="$runtime_root/bin/oreslang"
          test -f "$launcher" && test -x "$launcher" && test ! -L "$launcher" || { echo 'invalid approved Oreslang launcher' >&2; exit 1; }
          test "$(/usr/bin/stat -c %u -- "$launcher")" = 0
          [[ "${APPROVED_ORESLANG_RUNTIME_MANIFEST_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'missing approved runtime manifest' >&2; exit 1; }
          actual_manifest="$(
            cd "$runtime_root"
            /usr/bin/find . -xdev -type f -print0 |
              LC_ALL=C /usr/bin/sort -z |
              /usr/bin/xargs -0 -r /usr/bin/sha256sum |
              /usr/bin/sha256sum | /usr/bin/cut -d ' ' -f 1
          )"
          test "$actual_manifest" = "${APPROVED_ORESLANG_RUNTIME_MANIFEST_SHA256,,}" || { echo 'runtime manifest drift before wire exchange' >&2; exit 1; }
          if [[ ! "${APPROVED_ORESLANG_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'missing administrator-approved Oreslang SHA-256' >&2
            exit 1
          fi
          actual_sha="$(sha256sum -- "$launcher" | cut -d ' ' -f 1)"
          test "$actual_sha" = "${APPROVED_ORESLANG_SHA256,,}" || { echo 'unapproved real-wire launcher' >&2; exit 1; }
          printf 'real_wire_oreslang_path=%s\nreal_wire_oreslang_sha256=%s\n' "$launcher" "$actual_sha"
          # Reuse the digest-checking wrapper, not PATH, for both server and client.
          wrapper="$RUNNER_TEMP/oreslang-wire-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/oreslang"
          test -f "$wrapper" && test -x "$wrapper" || { echo 'verified Oreslang wrapper missing' >&2; exit 1; }
          export ores_proxy_conf_yaml="$GITHUB_WORKSPACE/config/worker-example.yaml"
          log="$RUNNER_TEMP/reverse-actor-ingress.log"
          # Only predeclared loopback is reachable. Do not grant --allow-all.
          "$wrapper" --no-prompt --allow-net=127.0.0.1:8080 \
            --allow-read="$ores_proxy_conf_yaml" \
            --allow-env=ores_proxy_conf_yaml \
            src/serve_reverse.ores >"$log" 2>&1 &
          server_pid=$!
          # Termination is bounded even when a damaged actor ignores SIGTERM.
          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill -TERM "$server_pid" 2>/dev/null || true
              for _ in {1..50}; do
                kill -0 "$server_pid" 2>/dev/null || break
                sleep 0.1
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -KILL "$server_pid" 2>/dev/null || true
              fi
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            if grep -Fq 'EXPERIMENTAL loopback actor ingress' "$log"; then
              ready=1
              break
            fi
            sleep 1
          done
          if test "$ready" != 1; then
            cat "$log"
            echo "Oreslang server did not bind within bounded readiness window" >&2
            exit 1
          fi
          timeout --signal=TERM --kill-after=5s 30s \
            "$wrapper" --no-prompt --allow-net=127.0.0.1:8080 \
            tests/actor_ingress_tcp_smoke.ores
          cat "$log"
