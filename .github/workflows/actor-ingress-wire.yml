name: Native actor ingress real-wire gate
on:
  pull_request:
    paths:
      # Any transitive admission/policy change can alter actor wire behavior.
      - 'src/**'
      - 'config/**'
      - 'tests/actor_ingress_tcp_smoke.ores'
      - '.github/workflows/actor-ingress-wire.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reverse-wire-${{ github.repository }}
  cancel-in-progress: false
jobs:
  actor-ingress:
    # Do not schedule unapproved repository or fork source on the trusted runner.
    # SECURITY HOLD: this PR-head workflow must not execute on a self-hosted runner.
    # Native admission belongs to independently reviewed protected-main frozen-source controls.
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify trusted exact source and approved native runtime
        shell: bash
        env:
          APPROVED_REPOSITORY_ID: '1429954649'
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          EVENT_PR_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          APPROVED_ORESLANG_SHA256: ${{ vars.ORESLANG_APPROVED_SHA256 }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved repository ID' >&2; exit 1; }
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$EVENT_PR_HEAD_REPO_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved PR head repository ID' >&2; exit 1; }
            test "$EVENT_PR_BASE_REPO_ID" = "$APPROVED_REPOSITORY_ID" || { echo 'unapproved PR base repository ID' >&2; exit 1; }
          fi
          test "${RUNNER_OS:-}" = Linux && test "${RUNNER_ARCH:-}" = X64 && test "$(uname -m)" = x86_64
          test -n "${RUNNER_NAME:-}" || { echo 'runner not assigned' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo 'exact source HEAD mismatch' >&2; exit 1; }
          printf 'runner_name=%s\nsource_head=%s\nsource_tree=%s\n' "$RUNNER_NAME" "$EXPECTED_SHA" "$(git rev-parse HEAD^{tree})"
          java -version
          jdk_spec="$(java -XshowSettings:properties -version 2>&1 | sed -nE 's/^[[:space:]]*java\.specification\.version[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' | head -n 1)"
          test "$jdk_spec" = 25 || { echo 'JDK 25 required' >&2; exit 1; }
          launcher="$(type -P oreslang || true)"
          test -n "$launcher" || { echo 'missing Oreslang launcher' >&2; exit 1; }
          launcher="$(readlink -f -- "$launcher")"
          test -f "$launcher" && test -x "$launcher"
          if [[ ! "${APPROVED_ORESLANG_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'missing administrator-approved Oreslang SHA-256' >&2
            exit 1
          fi
          actual_sha="$(sha256sum -- "$launcher" | cut -d ' ' -f 1)"
          printf 'oreslang_path=%s\noreslang_sha256=%s\n' "$launcher" "$actual_sha"
          test "$actual_sha" = "${APPROVED_ORESLANG_SHA256,,}" || { echo 'unapproved Oreslang launcher' >&2; exit 1; }
          echo 'oreslang_approved_digest=true'
          # A private wrapper rechecks the administrator-approved digest on each exec.
          test -n "${RUNNER_TEMP:-}" && test -n "${GITHUB_RUN_ID:-}" && test -n "${GITHUB_RUN_ATTEMPT:-}"
          wrapper_dir="${RUNNER_TEMP}/oreslang-wire-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 -- "$wrapper_dir"
          wrapper="$wrapper_dir/oreslang"
          printf '%s\n' '#!/bin/bash' 'set -euo pipefail' > "$wrapper"
          printf 'launcher=%q\n' "$launcher" >> "$wrapper"
          printf 'expected_sha=%q\n' "${APPROVED_ORESLANG_SHA256,,}" >> "$wrapper"
          printf '%s\n' \
            'test -f "$launcher" && test -x "$launcher" || exit 1' \
            'actual_sha="$(/usr/bin/sha256sum -- "$launcher" | /usr/bin/cut -d " " -f 1)"' \
            'test "$actual_sha" = "$expected_sha" || { echo "approved Oreslang launcher changed" >&2; exit 1; }' \
            'exec "$launcher" "$@"' >> "$wrapper"
          chmod 700 "$wrapper"
          if timeout 15s "$wrapper" --build-info; then
            echo 'oreslang_probe=--build-info'
          elif timeout 15s "$wrapper" --version; then
            echo 'oreslang_probe=--version'
          elif timeout 15s "$wrapper" --help; then
            echo 'oreslang_probe=--help'
          else
            echo 'bounded Oreslang launcher probes failed' >&2
            exit 1
          fi
          "$wrapper" --check src/serve_reverse.ores
          "$wrapper" --check tests/actor_ingress_tcp_smoke.ores
      - name: Real native Oreslang actor HTTP exchange over loopback
        shell: bash
        env:
          APPROVED_ORESLANG_SHA256: ${{ vars.ORESLANG_APPROVED_SHA256 }}
        run: |
          set -euo pipefail
          # Revalidate the executable in the same step as real-wire execution.
          # An earlier step's PATH lookup cannot authorize later invocations.
          launcher="$(type -P oreslang || true)"
          test -n "$launcher" || { echo 'missing Oreslang launcher' >&2; exit 1; }
          launcher="$(readlink -f -- "$launcher")"
          test -f "$launcher" && test -x "$launcher" || { echo 'invalid Oreslang launcher' >&2; exit 1; }
          if [[ ! "${APPROVED_ORESLANG_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'missing administrator-approved Oreslang SHA-256' >&2
            exit 1
          fi
          actual_sha="$(sha256sum -- "$launcher" | cut -d ' ' -f 1)"
          test "$actual_sha" = "${APPROVED_ORESLANG_SHA256,,}" || { echo 'unapproved real-wire launcher' >&2; exit 1; }
          printf 'real_wire_oreslang_path=%s\nreal_wire_oreslang_sha256=%s\n' "$launcher" "$actual_sha"
          # Reuse the digest-checking wrapper, not PATH, for both server and client.
          wrapper="$RUNNER_TEMP/oreslang-wire-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/oreslang"
          test -f "$wrapper" && test -x "$wrapper" || { echo 'verified Oreslang wrapper missing' >&2; exit 1; }
          export ores_proxy_conf_yaml="$GITHUB_WORKSPACE/config/worker-example.yaml"
          log="$RUNNER_TEMP/reverse-actor-ingress.log"
          # Only predeclared loopback is reachable. Do not grant --allow-all.
          "$wrapper" --no-prompt --allow-net=127.0.0.1:8080 \
            --allow-read="$ores_proxy_conf_yaml" \
            --allow-env=ores_proxy_conf_yaml \
            src/serve_reverse.ores >"$log" 2>&1 &
          server_pid=$!
          # Termination is bounded even when a damaged actor ignores SIGTERM.
          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill -TERM "$server_pid" 2>/dev/null || true
              for _ in {1..50}; do
                kill -0 "$server_pid" 2>/dev/null || break
                sleep 0.1
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -KILL "$server_pid" 2>/dev/null || true
              fi
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            if grep -Fq 'EXPERIMENTAL loopback actor ingress' "$log"; then
              ready=1
              break
            fi
            sleep 1
          done
          if test "$ready" != 1; then
            cat "$log"
            echo "Oreslang server did not bind within bounded readiness window" >&2
            exit 1
          fi
          timeout --signal=TERM --kill-after=5s 30s \
            "$wrapper" --no-prompt --allow-net=127.0.0.1:8080 \
            tests/actor_ingress_tcp_smoke.ores
          cat "$log"
