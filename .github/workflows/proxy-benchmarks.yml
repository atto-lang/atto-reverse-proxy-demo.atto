name: Proxy Benchmark Harness
on:
  pull_request:
    paths: ['bench/**', 'tests/perf_policy_contract.ores', '.github/workflows/proxy-benchmarks.yml']
  workflow_dispatch:
permissions:
  contents: read

# Hosted-only harness: it may execute PR benchmark code, but it has no native
# Oreslang runtime, no write token and no release authority. Native execution
# is owned by the trusted-target native-contracts workflow.
jobs:
  harness-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Install benchmark dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx haproxy jq
          # Use fixture-specific configs only; stop distribution default listeners.
          sudo systemctl stop nginx haproxy || true
      - name: Check Rust formatting and correctness tests
        working-directory: bench
        run: |
          cargo fmt --manifest-path driver/Cargo.toml --check
          cargo test --manifest-path driver/Cargo.toml --locked
          bash -n run.sh policy.sh
          bash test-summary.sh
      - name: Bind benchmark provenance to checked-out Git objects
        shell: bash
        env:
          EXPECTED_PR_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_head" = "$EXPECTED_PR_SHA" || { echo 'benchmark checkout SHA mismatch' >&2; exit 1; }
          printf 'benchmark_source_head=%s\nbenchmark_source_tree=%s\n' "$actual_head" "$actual_tree"
          echo "BENCH_SOURCE_SHA=$actual_head" >> "$GITHUB_ENV"
          echo "BENCH_SOURCE_TREE_SHA=$actual_tree" >> "$GITHUB_ENV"
      - name: Run baseline correctness smoke (no performance release gate)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          export PATH="/usr/sbin:$PATH"
          bash bench/run.sh
      - name: Preserve exact config, version, raw samples and summary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxy-benchmark-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/ores-proxy-bench.*/
          retention-days: 14
