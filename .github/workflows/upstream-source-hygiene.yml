# Structural-only: this workflow does not run .ores guest code.
name: Upstream source hygiene (structural only)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate source-tip contract and optional immutable compiler pin
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/UPSTREAM_SOURCE_TIPS_2026-10-29.md
          if [[ -f SOURCE_REF ]]; then
            grep -Eq '^[0-9a-f]{40}$' SOURCE_REF
            test "$(wc -l < SOURCE_REF)" -eq 1
          fi
      - name: Deny Python tooling
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(git ls-files -z -- '*.py' '*.pyi' '*.ipynb')
          if (( ${#python_files[@]} )); then
            printf 'POLICY_FAILURE: Python tooling must be ported to Rust:\n' >&2
            printf '  %s\n' "${python_files[@]}" >&2
            exit 1
          fi
      - name: Explicit structural-only verdict
        shell: bash
        run: |
          set -euo pipefail
          n="$(git ls-files -- '*.ores' | wc -l | tr -d ' ')"
          printf 'STRUCTURAL_ONLY tracked_ores_sources=%s\n' "$n"
          printf 'NOT_EXECUTED: no genuine compiler or Oreslang guest was run\n'

      # Untrusted PR-head shell scripts are source DATA: never run them on the
      # hosted PR workflow. Only a separately reviewed protected main may run
      # actual source-policy and adversarial suites.
      - name: Parse PR policy scripts without executing PR-owned code
        if: github.event_name == 'pull_request'
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          set -euo pipefail
          for script in ci/test-source-policy.sh ci/source-policy.sh; do
            test -f "$script" && test ! -L "$script" && test -s "$script" || exit 1
            /bin/bash -p -n "$script"
          done
          # Inline synthetic mutation: unsafe script and BASH_ENV must be inert
          # under syntax-only validation, not executed as a PR subprocess.
          scratch="$(/usr/bin/mktemp -d -- "$RUNNER_TEMP/hostile-upstream.XXXXXX")"
          trap '/usr/bin/rm -rf -- "$scratch"' EXIT
          /usr/bin/printf '%s\n' '#!/bin/bash' \
            'touch "${ATTACK_MARKER:?}"' \
            'x="$(touch "${ATTACK_MARKER:?}")"' > "$scratch/attacker.sh"
          /usr/bin/printf '%s\n' 'touch "${ATTACK_MARKER:?}"' > "$scratch/startup.sh"
          ATTACK_MARKER="$scratch/marker" BASH_ENV="$scratch/startup.sh" \
            /bin/bash -p -n "$scratch/attacker.sh"
          test ! -e "$scratch/marker" || {
            echo 'SECURITY_FAILURE: PR-owned policy script executed under hosted syntax gate' >&2
            exit 1
          }
          echo 'UPSTREAM_PR_SCRIPT_NOEXEC_NEGATIVE_PASS shell=2 bash_env=1; native_guest=NOT_EXECUTED'
      - name: Reject unprotected main for executable policy runs
        if: github.event_name != 'pull_request'
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' && test "$REF_PROTECTED" = true || {
            echo 'SECURITY_FAILURE: source-policy execution requires protected main' >&2
            exit 1
          }
      - name: Test adversarial source-policy regressions (protected main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_protected == true
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: /bin/bash -p ci/test-source-policy.sh
      - name: Enforce exact Git-index source policy (protected main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_protected == true
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_POLICY_MODE: strict
        run: /bin/bash -p ci/source-policy.sh
