      - name: Compiler-check native generation contract
        run: '"/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check tests/generation_contract.ores'
      - name: Compiler-check native middleware contract
        run: '"/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check tests/middleware_generation_contract.ores'
      - name: Compiler-check canonical path contract
        run: '"/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check tests/path_admission_contract.ores'
      - name: Execute canonical configuration path contract
        run: '"/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" tests/path_admission_contract.ores'
      - name: Execute YAML / routing / policy contract
