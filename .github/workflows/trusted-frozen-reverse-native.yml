          "/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check src/middleware_manifest.ores
          "/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check src/data_layout.ores
      - name: Compiler-check all security and slot regression vectors
        run: |
          "/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check tests/security_admission_contract.ores
          "/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check tests/wire_contract.ores
          "/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check tests/header_policy_contract.ores
          "/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check tests/middleware_manifest_contract.ores
          "/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check tests/data_layout_contract.ores
          "/opt/oreslang-approved/oreslang-runtime/bin/verified-reverse-oreslang" --check tests/slot_lifecycle_contract.ores
